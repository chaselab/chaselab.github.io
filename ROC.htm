<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>

<head>

<!--The style information below arranges the graphs side by side.-->
<style type="text/css">
			 .fieldset-width{float: left; height: 100%;}
			 .position1{white-space: nowrap;}
			 .position2{display: inline-block; vertical-align: top;}
			 .clearfloat{clear: both;}
</style>

<!--This canvas displays the normal distributions.-->
<div class = "position1">
<canvas id="graph1" class = "position2" width="600" height="600" style="border:1px solid #000000;">

<!--This canvas displays the accuracy graph.-->
<canvas id="graph2" class = "position2" width="600" height="600" style="border:1px solid #000000;">

</div>

<div class = "position1">
<fieldset class = "position2">
<legend>Parameter Controls</legend>

<!--These are the controls for the graphs.-->
<form name="graphinput" id="graphinput">
			<div class = "position2">
			Adjust &#956;<sub>Blue</sub>: </br>-10<input type="range" name="changemeanN" min="-10" max="10" step="0.2" value="-10" width="200" onchange="updateMeanN(this.value)">10</br>
			<input type="text" name="meanN" size="40" value="-10" onchange="updateChangeMeanN(this.value)"></br></br>
			Adjust &#963;<sup>2</sup><sub>Blue</sub>: </br>&nbsp;&nbsp;&nbsp;1<input type="range" name="changevarianceN" min="1" max="10" step="0.1" value="10" width="200" onchange="updateVarianceN(this.value)">10</br>
			<input type="text" name="varianceN" size="40" value="10" onchange="updateChangeVarianceN(this.value)"></br></br>
			Threshold: </br>-40<input type="range" name="changeaccuracy" min="-40" max="40" step="0.1" value="0" width="200" onchange="updateAccuracy(this.value)">40</br>
			<input type="text" name="accuracy" size="40" value="0" onchange="updateChangeAccuracy(this.value)">
			</div>
			
			<div class = "position2">
			Adjust &#956;<sub>Red</sub>: </br>-10<input type="range" name="changemeanS" min="-10" max="10" step="0.2" value="10" width="200" onchange="updateMeanS(this.value)">10</br>
			<input type="text" name="meanS" size="40" value="10" onchange="updateChangeMeanS(this.value)"></br></br>
			Adjust &#963;<sup>2</sup><sub>Red</sub>: </br>&nbsp;&nbsp;&nbsp;1<input type="range" name="changevarianceS" min="1" max="10" step="0.1" value="10" width="200" onchange="updateVarianceS(this.value)">10</br>
			<input type="text" name="varianceS" size="40" value="10" onchange="updateChangeVarianceS(this.value)">
			</div>
</form>
</fieldset>
			 <!--This is the reset button and the accuracy and area-under-curve displays.-->

			       <input type="button" name="reset" value="Reset Graphs" onclick="resetGraph()"></br>

			   	             * Math.pow(Math.E,( (-1 * Math.pow(( ((i - 400)/10) - Number(document.graphinput.meanN.value)),2))/(2*Math.pow(Number(document.graphinput.varianceN.value),2)) )  ))*50;
						      mu2Y += ((1/(Number(document.graphinput.varianceS.value)*(Math.sqrt(2*Math.PI)))) //))* Math.pow(Math.E,((-1 * Math.pow(t,2))/2)))
						           * Math.pow(Math.E,( (-1 * Math.pow(( ((i - 400)/10) - Number(document.graphinput.meanS.value)),2))/(2*Math.pow(Number(document.graphinput.varianceS.value),2)) )  ))*50;		 
					  }
						
						if(i <= (Number(document.graphinput.meanN.value) - Number(document.graphinput.varianceN.value) + 40)*10)
						{
						      muS1X += ((1/(Number(document.graphinput.varianceN.value)*(Math.sqrt(2*Math.PI))))
			   	             * Math.pow(Math.E,( (-1 * Math.pow(( ((i - 400)/10) - Number(document.graphinput.meanN.value)),2))/(2*Math.pow(Number(document.graphinput.varianceN.value),2)) )  ))*50;
						      muS1Y += ((1/(Number(document.graphinput.varianceS.value)*(Math.sqrt(2*Math.PI)))) //))* Math.pow(Math.E,((-1 * Math.pow(t,2))/2)))

						if(i <= (Number(document.graphinput.meanS.value) + Number(document.graphinput.varianceS.value) + 40)*10)

						      muS2X += ((1/(Number(document.graphinput.varianceN.value)*(Math.sqrt(2*Math.PI))))

						      muS2Y += ((1/(Number(document.graphinput.varianceS.value)*(Math.sqrt(2*Math.PI)))) //))* Math.pow(Math.E,((-1 * Math.pow(t,2))/2)))
						           * Math.pow(Math.E,( (-1 * Math.pow(( ((i - 400)/10) - Number(document.graphinput.meanS.value)),2))/(2*Math.pow(Number(document.graphinput.varianceS.value),2)) )  ))*50;		 
					  }
						
						if(i <= (B-40)*800/500)
						{
						      intersectX += ((1/(Number(document.graphinput.varianceN.value)*(Math.sqrt(2*Math.PI))))
			   	             * Math.pow(Math.E,( (-1 * Math.pow(( ((i - 400)/10) - Number(document.graphinput.meanN.value)),2))/(2*Math.pow(Number(document.graphinput.varianceN.value),2)) )  ))*50;

					  }*/
			}
			accuracy = ((markerX/500 + (1 - markerY/500))/2)*100;
			
			document.getElementById("AUC").innerHTML = "Area Under Curve: " + (1 - AUC).toFixed(2);
			document.getElementById("accuracy").innerHTML = "Accuracy at Threshold: " + accuracy.toFixed(2) + "%";

			context2.beginPath();
			
			context2.strokeStyle="#0000FF";
			context2.beginPath();
			context2.moveTo(560 - yN[0], 40 + yS[0]);

			//Debug command.

}

//The function below draws the diagonal line on the Hits vs. False Alarms graph.
function drawLine()
{
      context2.save();
			context2.rect(60,40,500,500);
			context2.clip();
			context2.lineWidth=2;
			context2.moveTo(60,540);
			context2.lineTo(560,40);
			context2.stroke();
			context2.restore();
			context2.beginPath();

//The function below resets the input.
function resetGraph()
{
      document.graphinput.meanN.value = -10;
			document.graphinput.changemeanN.value = -10;
			document.graphinput.varianceN.value = 10;
			document.graphinput.changevarianceN.value = 10;
			document.graphinput.meanS.value = 10;
			document.graphinput.changemeanS.value = 10;
			document.graphinput.varianceS.value = 10;
			document.graphinput.changevarianceS.value = 10;
			document.graphinput.accuracy.value = 0;
			document.graphinput.changeaccuracy.value = 0;
			updateGraph1();
			updateGraph2();
}

//The 8 functions below match the slider and text field values, and prevent silly input.
function updateMeanN(x)
{
      document.graphinput.meanN.value=x;
			updateGraph1();
			updateGraph2();
}

function updateChangeMeanN(x)
{
      if(isNaN(x) || x < -10 || x > 10)
			{
			      document.graphinput.meanN.value = document.graphinput.changemeanN.value;
						x = document.graphinput.changemeanN.value;
			}
      document.graphinput.changemeanN.value = x;
			updateGraph1();
			updateGraph2();
}

function updateVarianceN(x)
{
      document.graphinput.varianceN.value=x;
			updateGraph1();
			updateGraph2();
}

function updateChangeVarianceN(x)
{
      if(isNaN(x) || x < 1 || x > 10)
			{
			      document.graphinput.varianceN.value = document.graphinput.changevarianceN.value;
						x = document.graphinput.changevarianceN.value;
			}
      document.graphinput.changevarianceN.value = x;
			updateGraph1();
			updateGraph2();
}

function updateMeanS(x)
